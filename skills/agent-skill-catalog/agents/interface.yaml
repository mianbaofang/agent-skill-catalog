interface:
  display_name: "Agent Skill Catalog"
  short_description: "扫描本地 SKILL.md，按分类、家族和插件生成可检索目录，并优先显示 GitHub 仓库预览图"
  default_prompt: "Use $agent-skill-catalog to scan these explicit local skill roots. Start with --require-complete-descriptions. If exit code 3 occurs, repeatedly run scripts/description_queue.py next with the same roots or config, write each evidence-backed Chinese response batch, and apply it with scripts/description_queue.py apply. Resume from catalog-curation.json until next returns zero items, then rebuild with --refresh --require-complete-descriptions and verify pending_description_count is zero. Resolve observed GitHub sources, keep the best verified family/plugin preview, do not hand the queue to the user, and do not install or edit scanned skills."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-github-preview-cache-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-workspace-trust-notes"
